name: Sync catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifests
        run: node scripts/sync.mjs --check

      # Non-blocking: the shared dev deployment only gains syncCatalog once a
      # post-Skill-Store checkout pushes its Convex functions, so dev can lag
      # behind main. Never let that hold the prod sync hostage.
      - name: Sync catalog → dev
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: node scripts/sync.mjs

      - name: Sync catalog → prod
        if: vars.SYNC_PROD == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: node scripts/sync.mjs
