name: Sync catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifests
        run: node scripts/sync.mjs --check

      - name: Sync catalog → dev
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: node scripts/sync.mjs

      # Expected to fail until the Skill Store branch (orgorg#3889) ships to
      # prod — syncCatalog doesn't exist on the prod deployment yet. Flip this
      # back to a hard failure once it does.
      - name: Sync catalog → prod
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: node scripts/sync.mjs
