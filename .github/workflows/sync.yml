name: Sync catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifests
        run: node scripts/sync.mjs --check

      - name: Sync catalog → dev
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: node scripts/sync.mjs

      # Off until the Skill Store branch (orgorg#3889) ships to prod —
      # syncCatalog doesn't exist on the prod deployment yet. To turn it on,
      # set the repo variable SYNC_PROD=true (gh variable set SYNC_PROD -b true).
      - name: Sync catalog → prod
        if: vars.SYNC_PROD == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
        run: node scripts/sync.mjs
